<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>f(A, B) Surface Plotter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>f(A, B) Plotter</h1>
    <p class="hint">
      Type expressions in <b>A</b> and <b>B</b> — e.g. <code>sin(2A+B)</code>,
      <code>tan(cosA+sinB)</code>. Supports <code>+ - * / ^</code> and
      <code>sin cos tan asin acos atan sqrt log ln exp abs</code>.
    </p>

    <div id="equation-list"></div>
    <button id="add-eq" class="btn-add">+ Add equation</button>

    <div class="controls">
      <h2>Range &amp; resolution</h2>

      <label class="control-row">
        <span>A, B range: ± <span id="range-val">6.28</span></span>
        <input type="range" id="range-slider" min="1" max="12.56" step="0.01" value="6.28">
      </label>

      <label class="control-row">
        <span>Grid resolution: <span id="res-val">60</span></span>
        <input type="range" id="res-slider" min="10" max="150" step="1" value="60">
      </label>

      <label class="control-row checkbox-row">
        <span><input type="checkbox" id="clamp-toggle" checked> Clamp output to ± <span id="clamp-val">10</span></span>
        <input type="range" id="clamp-slider" min="1" max="50" step="1" value="10">
      </label>

      <label class="control-row checkbox-row">
        <span><input type="checkbox" id="wireframe-toggle"> Wireframe overlay</span>
      </label>

      <button id="reset-view" class="btn-secondary">Reset view</button>
    </div>
  </aside>

  <main id="viewport"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.3/math.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="script.js"></script>
</body>
</html>
